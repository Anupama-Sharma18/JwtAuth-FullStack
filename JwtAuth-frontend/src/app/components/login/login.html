<div class="login-container">

  <h2>Login</h2>

  <form (ngSubmit)="login()">

    <div>

      <label>Username</label>

      <input
        type="text"
        name="username"
        [(ngModel)]="username"
        required
      >

    </div>


    <div>

      <label>Password</label>

      <input
        type="password"
        name="password"
        [(ngModel)]="password"
        required
      >

    </div>


    <button type="submit">
      Login
    </button>

  </form>


  @if (message) {

    <p>
      {{ message }}
    </p>

  }


  @if (errorMessage) {

    <p>
      {{ errorMessage }}
    </p>

  }


  <hr>


  <button
    type="button"
    (click)="loginWithGoogle()">

    Continue with Google

  </button>

</div>
